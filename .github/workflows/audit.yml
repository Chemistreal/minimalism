# 화면을 한 줄씩 재는 검사. 여기는 여태 **검사가 하나도 없었다.**
#
# 다른 세 앱(exam·DT·KMChC)에는 전수 검수가 매번 도는데 이 저장소만 빠져
# 있었다. 목록에 없으면 아무도 안 본다 — 이 저장소가 통째로 그 짝이었다.
#
# 재는 것은 사람 판단이 필요 없는 것들뿐이다: 색 대비·글씨 크기·viewport·
# 제목 단계·표 머리·깨진 링크.
name: 화면 전수 검수

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']
  # ⚠ 매일 도는 일정은 **일부러 뺐다.** 이 저장소는 지금 손대지 않는 쪽으로
  # 정해졌다(2026-08). 아무도 안 건드리는 저장소가 매일 아침 메일을 보내면
  # 그 메일부터 안 읽게 된다. 누가 실제로 밀 때만 재고, 평소엔 조용하다.
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 화면 전수 검수 (대비 · 글씨 · 링크)
        run: python3 tools/audit_pages.py
